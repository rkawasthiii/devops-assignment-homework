name: Final Project - Full Pipeline

# Canonical copy lives at repo root (.github/workflows/session21-final.yml)
# so GitHub Actions actually executes it for this monorepo layout.

on:
  push:
    paths: ["session21-python/**"]

env:
  APP_DIR: session21-python/application
  DOCKER_DIR: session21-python/docker

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ${{ env.APP_DIR }}/requirements.txt
      - run: python -m unittest discover -s ${{ env.APP_DIR }}/tests -v

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Trivy fs scan (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: session21-python
          severity: CRITICAL,HIGH

  build-scan-push:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taskboard:${{ github.sha }} -f ${{ env.DOCKER_DIR }}/Dockerfile session21-python
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskboard:${{ github.sha }}
          severity: CRITICAL,HIGH
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker tag taskboard:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/taskboard:latest
          docker push ghcr.io/${{ github.repository_owner }}/taskboard:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-scan-push
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests (offline)
        run: kubeconform -strict -summary session21-python/kubernetes/manifests/
      - name: Deploy note
        run: echo "Prod deploy via GitOps — ArgoCD syncs session21-python/kubernetes/manifests automatically"
