apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
data:
  # base64-encoded: echo -n 'admin' | base64  ->  YWRtaW4=
  DB_USER: YWRtaW4=
  # echo -n 'Sup3rS3cret!' | base64  ->  U3VwM3JTM2NyZXQh
  DB_PASS: U3VwM3JTM2NyZXQh
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
  - name: app
    image: nginx:alpine
    command: ["sleep", "3600"]
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: DB_USER
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: DB_PASS
