name: Session 21 - Final Project Pipeline

on:
  push:
    paths:
      - "session21-python/**"
      - ".github/workflows/session21-final.yml"
  workflow_dispatch:

env:
  APP_DIR: session21-python/application
  DOCKER_DIR: session21-python/docker

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  test:
    name: 1. Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ${{ env.APP_DIR }}/requirements.txt
      - run: python -m unittest discover -s ${{ env.APP_DIR }}/tests -v

  security:
    name: 2. Security Scans
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Trivy fs scan (SCA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: session21-python
          severity: CRITICAL,HIGH

  build-scan-push:
    name: 3. Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taskboard:${{ github.sha }} -f ${{ env.DOCKER_DIR }}/Dockerfile session21-python
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: taskboard:${{ github.sha }}
          severity: CRITICAL,HIGH
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker tag taskboard:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/taskboard:latest
          docker push ghcr.io/${{ github.repository_owner }}/taskboard:latest

  deploy:
    name: 4. Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-scan-push
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Validate manifests
        run: kubectl apply -f session21-python/kubernetes/manifests/ --dry-run=client -o yaml > /dev/null && echo "manifests valid"
      - name: GitOps note
        run: echo "Prod deploy via GitOps — ArgoCD syncs session21-python/kubernetes/manifests automatically (see gitops/application.yaml)"
