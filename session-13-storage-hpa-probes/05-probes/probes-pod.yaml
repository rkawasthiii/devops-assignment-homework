apiVersion: v1
kind: Pod
metadata:
  name: probes-demo
spec:
  containers:
  - name: web
    image: nginx:alpine
    ports:
    - containerPort: 80
    startupProbe:                 # is the container done starting?
      httpGet:
        path: /
        port: 80
      failureThreshold: 30
      periodSeconds: 2
    readinessProbe:               # ready to receive traffic?
      httpGet:
        path: /
        port: 80
      periodSeconds: 5
    livenessProbe:                # still healthy? (restart if dead)
      httpGet:
        path: /
        port: 80
      periodSeconds: 10
