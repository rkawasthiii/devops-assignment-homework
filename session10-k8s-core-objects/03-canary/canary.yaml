apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stable
spec:
  replicas: 3                      # stable handles most traffic
  selector:
    matchLabels:
      app: web-canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: web-canary-demo
        track: stable
        version: v1
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
spec:
  replicas: 1                      # canary gets ~25% of traffic (1 of 4 pods)
  selector:
    matchLabels:
      app: web-canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: web-canary-demo
        track: canary
        version: v2
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-canary-service
spec:
  selector:
    app: web-canary-demo           # matches BOTH stable and canary pods
  ports:
  - port: 80
    targetPort: 80
